<head>

<style>
@font-face{font-family:'GUD Pixel';src:url(../../fonts/GUDPixel-Regular.woff2) format('woff2'),url(../../fonts/GUDPixel-Regular.woff) format('woff');font-display:swap}
@font-face{font-family:'VT323';src:url(../../fonts/VT323-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
@font-face{font-family:'VT323';src:url(../../fonts/VT323-latin-ext.woff2) format('woff2');unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;font-display:swap}
@font-face{font-family:'Press Start 2P';src:url(../../fonts/PressStart2P-latin.woff2) format('woff2');font-display:swap}
:root{--y:#FFE600;--p:#FF1493;--b:#FF85C8;--l:#FFD6EA;--k:#111111;--w:#FFF9F1;
--pix:'GUD Pixel','Press Start 2P',ui-monospace,Menlo,Consolas,monospace;--body:'VT323',ui-monospace,Menlo,Consolas,monospace}
html.embed #topbar{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--l);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{font-family:var(--body);color:var(--k);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--l)}
#topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--k);border-bottom:3px solid var(--p)}
.brand{font-family:var(--pix);color:var(--y);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:1px}
.brand b{color:var(--p);font-weight:400}
.tools{display:flex;gap:6px;flex:0 0 auto}
.tbtn{font-family:var(--pix);line-height:1;border:2px solid var(--w);background:var(--k);color:var(--w);box-shadow:2px 2px 0 var(--p);border-radius:0}
.tbtn.hack{background:var(--y);color:var(--k);border-color:var(--y)}
.tbtn:active{transform:translate(2px,2px);box-shadow:none}
.tbtn:focus-visible,.btn:focus-visible,.cb:focus-visible{outline:3px dashed var(--y);outline-offset:2px}
.tbtn[hidden]{display:none}
#stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
 background-color:var(--l);background-image:linear-gradient(45deg,var(--b) 25%,transparent 25%,transparent 75%,var(--b) 75%),linear-gradient(45deg,var(--b) 25%,transparent 25%,transparent 75%,var(--b) 75%);
 background-size:8px 8px;background-position:0 0,4px 4px}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;outline:none;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,214,234,.6);z-index:5}
#overlay[hidden]{display:none}
.panel{position:relative;width:100%;max-height:100%;overflow:auto;background:var(--w);border:4px solid var(--k);box-shadow:8px 8px 0 var(--p);text-align:center;-webkit-user-select:text;user-select:text}
.panel.dark{background:var(--k);color:var(--w);box-shadow:8px 8px 0 var(--y)}
.title{font-family:var(--pix);font-weight:400;margin:0;line-height:1.25;color:var(--y);
 text-shadow:2px 0 var(--k),-2px 0 var(--k),0 2px var(--k),0 -2px var(--k),2px 2px var(--k),-2px -2px var(--k),2px -2px var(--k),-2px 2px var(--k),5px 5px 0 var(--p)}
.title span{display:inline-block}
.title.mid{color:var(--p);text-shadow:2px 0 var(--w),-2px 0 var(--w),0 2px var(--w),0 -2px var(--w),4px 4px 0 var(--y)}
.panel.dark .title.big{color:var(--p);text-shadow:2px 0 var(--w),-2px 0 var(--w),0 2px var(--w),0 -2px var(--w),5px 5px 0 var(--y)}
.sub{font-family:var(--body);font-style:italic;color:var(--p);margin:.4em 0 .6em}
.msg p{margin:.35em 0;line-height:1.05}
.msg .lead{font-family:var(--pix);color:var(--p);line-height:1.5}
.panel.dark .msg .lead{color:var(--y)}
.score{font-family:var(--pix);color:var(--p);margin:.8em 0}
.hint{font-family:var(--pix);color:var(--k);opacity:.75;margin:.9em 0 0;line-height:1.6}
.btn{font-family:var(--pix);border:3px solid var(--k);background:var(--p);color:var(--w);box-shadow:4px 4px 0 var(--k);border-radius:0;margin-top:.6em}
.btn.primary{background:var(--y);color:var(--k)}
.panel.dark .btn{border-color:var(--w);box-shadow:4px 4px 0 var(--p)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{background:var(--p);color:var(--w)}}
#hack{position:absolute;z-index:10;top:10px;right:10px}
#hack[hidden]{display:none}
.hackbox{background:var(--k);border:3px solid var(--y);box-shadow:6px 6px 0 var(--p);padding:12px;color:var(--y);font-family:var(--pix);width:250px;max-width:calc(100vw - 20px)}
.hackbox .ht{font-size:10px;margin:0 0 10px;letter-spacing:1px}
.hackbox .ht i{font-style:normal;animation:cur 0.8s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.hackbox input{width:100%;font-family:var(--pix);font-size:16px;background:var(--k);color:var(--y);caret-color:var(--p);border:2px dashed var(--p);padding:8px;border-radius:0;outline:none;text-transform:lowercase;-webkit-user-select:text;user-select:text}
.hackbox .row{display:flex;gap:8px;margin-top:10px}
.hackbox .row button{flex:1;font-family:var(--pix);font-size:10px;padding:8px 4px;border:2px solid var(--y);background:var(--y);color:var(--k);border-radius:0}
.hackbox .row button+button{background:var(--k);color:var(--y)}
#hackMsg{min-height:12px;margin-top:8px;font-size:9px;color:var(--p)}
.shake{animation:shake .35s steps(2)}
@keyframes shake{25%{transform:translate(-6px,0)}50%{transform:translate(6px,0)}75%{transform:translate(-3px,0)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.blink,.hackbox .ht i{animation:none}}

/* ---- DESKTOP LAYOUT ---- */
#topbar{height:38px;padding:0 10px}
.brand{font-size:10px}
.tbtn{font-size:9px;padding:7px 9px}
#overlay{padding:16px}
.panel{max-width:640px;padding:22px 26px 20px}
.title{font-size:clamp(18px,3.4vw,30px)}
.title.big{font-size:clamp(18px,3.4vw,30px)}
.title.mid{font-size:clamp(11px,1.6vw,15px);margin-top:12px}
.sub{font-size:22px}
.msg{font-size:21px}
.msg .lead{font-size:11px}
.score{font-size:10px}
.hint{font-size:8px}
.btn{font-size:13px;padding:14px 20px}
@media (max-height:420px){.panel{padding:12px 16px}.msg{font-size:18px}.sub{font-size:18px}.title{font-size:18px}}
</style>
</head>

const ASSETS = {};
(function loadAssets() {
  const M = window.GUD_ASSETS || {};
  Object.keys(M).forEach(key => {
    const def = typeof M[key] === 'string' ? { src: M[key] } : M[key];
    if (!def || !def.src) return;
    const img = new Image();
    img.onload = () => { ASSETS[key] = { img, frames: Math.max(1, def.frames || 1), fps: def.fps || 10 }; };
    img.onerror = () => { /* fallback to built-in pixel art */ };
    img.src = CFG.assetBase + def.src;
  });
})();
function drawCustom(c, key, x, y, w, h, t) {
  const a = ASSETS[key]; if (!a) return false;
  const fw = a.img.width / a.frames, fh = a.img.height;
  const s = Math.min(w / fw, h / fh), dw = Math.round(fw * s), dh = Math.round(fh * s);

  c.drawImage(a.img, fr * fw, 0, fw, fh, Math.round(x + (w - dw) / 2), Math.round(y + h - dh), dw, dh);
  return true;
}

let OVERLAY_NAME = null;
function showOverlay(name, focus) {
  OVERLAY_NAME = name; overlay.innerHTML = SCREENS[name](); overlay.hidden = false;
  if (focus) { const b = overlay.querySelector('.primary'); if (b) setTimeout(() => { try { b.focus({ preventScroll: true }); } catch (e) { /* */ } }, 60); }
}
function hideOverlay() { OVERLAY_NAME = null; overlay.hidden = true; overlay.innerHTML = ''; }
function showEnd() {
  S.state = 'end'; S.lastResult = S.result; S.result = null;
  S.score = Math.floor(S.score);
  if (S.score > S.best) { S.best = S.score; store.set('gud_best', String(S.best)); }
  const n = (S.mode === 'week' ? 'week' : 'wknd') + (S.lastResult === 'win' ? 'Win' : 'Lose');
  showOverlay(n, true);
}
function toIntro() {
  stopMusic(); resetRun('week'); S.state = 'intro'; menuBtn.hidden = true; showOverlay('intro');
}
function startRun(mode, opts) {
  opts = opts || {}; AU.init(); stopMusic();
  resetRun(mode); S.state = 'play'; S.lastResult = null; menuBtn.hidden = true; hideOverlay();
  const D = DAYS();
  if (opts.boss) { S.day = D.days.length - 1; S.min = D.bossAt; spawnBoss(); }
  else banner(D.days[0], mode === 'week' ? TX('tgif', 'goodLuck') : TX('tgif', 'freedom'), 1.8);
  if (!opts.silent) (mode === 'weekend' ? SFX.weekend : SFX.start)();
  focusGame();
}
function focusGame() { try { window.focus(); cvs.focus({ preventScroll: true }); } catch (e) { /* */ } }
overlay.addEventListener('click', e => {
  const b = e.target.closest('[data-do]'); if (!b) return; AU.init();
  const a = b.dataset.do;
  if (a === 'start' || a === 'retry-week' || a === 'restart') startRun('week');
  else if (a === 'weekend' || a === 'retry-weekend') startRun('weekend');
  else if (a === 'secret') startBeach();
});

/* ---------------------------------------------------------------------
   19. HACK PANEL — secret codes, available from every screen
   --------------------------------------------------------------------- */
function resetInputs() { Object.keys(input).forEach(k => { input[k] = false; }); document.querySelectorAll('[data-act].on').forEach(b => b.classList.remove('on')); }
function openHack() {
  AU.init(); S.hackOpen = true; hackEl.hidden = false; hackMsg.textContent = ''; hackInput.value = ''; resetInputs();
  setTimeout(() => { try { hackInput.focus({ preventScroll: true }); } catch (e) { hackInput.focus(); } }, 30);
}
function closeHack() { S.hackOpen = false; hackEl.hidden = true; hackInput.blur(); focusGame(); }
function handleCode(raw) {
  const code = String(raw || '').trim().toLowerCase();
  if (code === 'boss') { closeHack(); SFX.hack(); startRun(S.mode, { boss: true, silent: true }); return true; }
  if (code === 'tequila') { closeHack(); startRun('weekend'); return true; }
  if (code === 'ilovegud') { closeHack(); startBeach(); return true; }
  const adm = String(((CONTENT.settings || {}).adminCode) || 'gudmin').toLowerCase();
  if (code && code === adm) { closeHack(); SFX.hack(); try { (window.top || window).location.href = CFG.adminUrl || '../../admin/'; } catch (e) { location.href = CFG.adminUrl || '../../admin/'; } return true; }
  SFX.denied(); hackMsg.textContent = 'ACCESS DENIED';
  const box = hackForm; box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  try { hackInput.select(); } catch (e) { /* */ }
  return false;
}
hackBtn.addEventListener('click', () => (S.hackOpen ? closeHack() : openHack()));
$('hackClose').addEventListener('click', closeHack);
hackForm.addEventListener('submit', e => { e.preventDefault(); AU.init(); handleCode(hackInput.value); });
hackInput.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') closeHack(); });
menuBtn.addEventListener('click', () => { AU.init(); toIntro(); });
function syncMute() { muteBtn.textContent = AU.muted ? (LANG === 'it' ? 'AUDIO OFF' : 'SOUND OFF') : (LANG === 'it' ? 'AUDIO ON' : 'SOUND ON'); muteBtn.setAttribute('aria-pressed', AU.muted ? 'true' : 'false'); }
muteBtn.addEventListener('click', () => { AU.init(); AU.setMute(!AU.muted); syncMute(); tellParent({ mute: AU.muted }); focusGame(); });
syncMute();
HOOKS.mute.push(() => syncMute());
const CB_L = { left: ['SINISTRA', 'LEFT'], right: ['DESTRA', 'RIGHT'], duck: ['SCHIVA', 'DODGE'], shoot: ['SPARA', 'SHOOT'], jump: ['SALTA', 'JUMP'] };
function cbLabels() { document.querySelectorAll('.cb[data-act]').forEach(b => { const l = CB_L[b.dataset.act], sp = b.querySelector('span'); if (l && sp) { sp.textContent = l[LANG === 'it' ? 0 : 1]; b.setAttribute('aria-label', l[LANG === 'it' ? 0 : 1]); } }); }
cbLabels();
HOOKS.lang.push(() => { cbLabels(); syncMute(); if (OVERLAY_NAME) showOverlay(OVERLAY_NAME); const lb = $('langBtn'); if (lb) lb.textContent = LANG === 'it' ? 'EN' : 'IT'; });
HOOKS.code.push(c => { AU.init(); handleCode(c); });
{ const lb = $('langBtn'); if (lb) { lb.textContent = LANG === 'it' ? 'EN' : 'IT'; lb.addEventListener('click', () => { AU.init(); setLang(LANG === 'it' ? 'en' : 'it'); tellParent({ lang: LANG }); focusGame(); }); } }

/* ---------------------------------------------------------------------
   20. INPUT — keyboard + touch
   --------------------------------------------------------------------- */
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', Space: 'jump', KeyW: 'jump', ArrowDown: 'duck', KeyS: 'duck', KeyK: 'shoot' };
window.addEventListener('keydown', e => {
  if (S.hackOpen) { if (e.key === 'Escape') closeHack(); return; }
  AU.init();
  const tag = e.target && e.target.tagName;
  const a = KEYMAP[e.code];
  if (tag === 'BUTTON' && (e.code === 'Space' || e.code === 'Enter')) return;
  if (a) e.preventDefault();
  if (S.state === 'intro' && (e.code === 'Enter' || e.code === 'Space')) { startRun('week'); return; }
  if (S.state === 'end' && e.code === 'Enter') { const b = overlay.querySelector('.primary'); if (b) b.click(); return; }
  if (!a) return;
  if (a === 'jump' && !input.jump) pressJump();
  input[a] = true;
});
window.addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) input[a] = false; });
window.addEventListener('blur', resetInputs);
document.querySelectorAll('[data-act]').forEach(btn => {
  const a = btn.dataset.act;
  const on = e => { e.preventDefault(); AU.init(); try { btn.setPointerCapture(e.pointerId); } catch (_) { /* */ } if (a === 'jump' && !input.jump) pressJump(); input[a] = true; btn.classList.add('on'); };
  const off = () => { input[a] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', on); btn.addEventListener('pointerup', off); btn.addEventListener('pointercancel', off);
  btn.addEventListener('lostpointercapture', off); btn.addEventListener('contextmenu', e => e.preventDefault());
});
cvs.addEventListener('pointerdown', () => { AU.init(); if (S.state === 'beach' || (MOBILE && S.state === 'play')) pressJump(); focusGame(); });
document.addEventListener('visibilitychange', () => { S.paused = document.hidden; if (document.hidden) resetInputs(); });

/* ---------------------------------------------------------------------
   21. BOOT
   --------------------------------------------------------------------- */
buildSprites();
resize();
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
toIntro();
requestAnimationFrame(frame);
loadContent().then(() => { if (OVERLAY_NAME) showOverlay(OVERLAY_NAME); tellParent({ ready: 'tgif' }); });
// tiny debug/test hook (harmless): window.GUD
window.GUD = { state: S, player: P, input, startRun, handleCode, startBeach, toIntro, get boss() { return S.boss; } };

})();

</script>
