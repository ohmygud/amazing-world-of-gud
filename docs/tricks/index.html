    btn.addEventListener('click',function(){
      var code=btn.getAttribute('data-code');
      if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(code).then(function(){ done(btn,true); }, function(){ done(btn,fallbackCopy(code)); });
      } else done(btn,fallbackCopy(code));
    });
  });
})();
</script>
</body>
</html>
