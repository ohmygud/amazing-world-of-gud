html.embed #topbar{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--l);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{font-family:var(--body);color:var(--k);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

#stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
 background-color:var(--l);background-image:linear-gradient(45deg,var(--b) 25%,transparent 25%,transparent 75%,var(--b) 75%),linear-gradient(45deg,var(--b) 25%,transparent 25%,transparent 75%,var(--b) 75%);

canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;outline:none;touch-action:none}

.panel{position:relative;width:100%;max-height:100%;overflow:auto;background:var(--w);border:4px solid var(--k);box-shadow:8px 8px 0 var(--p);text-align:center;-webkit-user-select:text;user-select:text}
.panel.dark{background:var(--k);color:var(--w);box-shadow:8px 8px 0 var(--y)}
.title{font-family:var(--pix);font-weight:400;margin:0;line-height:1.25;color:var(--y);
 text-shadow:2px 0 var(--k),-2px 0 var(--k),0 2px var(--k),0 -2px var(--k),2px 2px var(--k),-2px -2px var(--k),2px -2px var(--k),-2px 2px var(--k),5px 5px 0 var(--p)}
.title span{display:inline-block}
.title.mid{color:var(--p);text-shadow:2px 0 var(--w),-2px 0 var(--w),0 2px var(--w),0 -2px var(--w),4px 4px 0 var(--y)}
.panel.dark .title.big{color:var(--p);text-shadow:2px 0 var(--w),-2px 0 var(--w),0 2px var(--w),0 -2px var(--w),5px 5px 0 var(--y)}
.sub{font-family:var(--body);font-style:italic;color:var(--p);margin:.4em 0 .6em}
.msg p{margin:.35em 0;line-height:1.05}
.msg .lead{font-family:var(--pix);color:var(--p);line-height:1.5}
.panel.dark .msg .lead{color:var(--y)}
.score{font-family:var(--pix);color:var(--p);margin:.8em 0}
.hint{font-family:var(--pix);color:var(--k);opacity:.75;margin:.9em 0 0;line-height:1.6}
.btn{font-family:var(--pix);border:3px solid var(--k);background:var(--p);color:var(--w);box-shadow:4px 4px 0 var(--k);border-radius:0;margin-top:.6em}
.btn.primary{background:var(--y);color:var(--k)}
.panel.dark .btn{border-color:var(--w);box-shadow:4px 4px 0 var(--p)}

.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{background:var(--p);color:var(--w)}}
#hack{position:absolute;z-index:10;top:10px;right:10px}
#hack[hidden]{display:none}
.hackbox{background:var(--k);border:3px solid var(--y);box-shadow:6px 6px 0 var(--p);padding:12px;color:var(--y);font-family:var(--pix);width:250px;max-width:calc(100vw - 20px)}
.hackbox .ht{font-size:10px;margin:0 0 10px;letter-spacing:1px}
.hackbox .ht i{font-style:normal;animation:cur 0.8s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.hackbox input{width:100%;font-family:var(--pix);font-size:16px;background:var(--k);color:var(--y);caret-color:var(--p);border:2px dashed var(--p);padding:8px;border-radius:0;outline:none;text-transform:lowercase;-webkit-user-select:text;user-select:text}
.hackbox .row{display:flex;gap:8px;margin-top:10px}
.hackbox .row button{flex:1;font-family:var(--pix);font-size:10px;padding:8px 4px;border:2px solid var(--y);background:var(--y);color:var(--k);border-radius:0}
.hackbox .row button+button{background:var(--k);color:var(--y)}
#hackMsg{min-height:12px;margin-top:8px;font-size:9px;color:var(--p)}
.shake{animation:shake .35s steps(2)}
@keyframes shake{25%{transform:translate(-6px,0)}50%{transform:translate(6px,0)}75%{transform:translate(-3px,0)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.blink,.hackbox .ht i{animation:none}}

#cvPanel{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(17,17,17,.6)}

#cvBody b{font-weight:400;color:var(--p)}

#cvBody .contacts a:hover,#cvBody .contacts a:focus-visible{background:var(--p);color:var(--w)}

.gv-stage iframe{display:block;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 230px);max-height:calc(100dvh - 230px);border:0;background:#111}
.gv-web iframe{aspect-ratio:auto;height:min(70vh,640px);height:min(70dvh,640px);background:#fff}
.gv-open{position:absolute;right:10px;bottom:10px;font-family:var(--pix,'GUD Pixel',monospace);font-size:10px;background:#FFE600;color:#111;border:2px solid #111;padding:8px 10px;text-decoration:none;box-shadow:3px 3px 0 #FF1493}
.gv-hint{position:absolute;left:10px;bottom:6px;margin:0;font:16px/1 var(--body,'VT323',monospace);color:#FF85C8;max-width:60%}

.gv-nav{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px}

.gv-dots button.on{background:#FF1493}
.gv-desc{font:20px/1.12 var(--body,'VT323',monospace);color:#111;padding:0 14px 14px;max-height:22vh;overflow:auto}

#topbar{height:38px;padding:0 10px}
.brand{font-size:10px}

/* =====================================================================
   GUD VIEWER — pixel-style gallery for project media
   (images, uploaded videos, YouTube, Vimeo, web pages). Shared by
   GUDQUEST, the BANALE CV and the CMS preview.
   ===================================================================== */
(function () {
  'use strict';
  if (window.GUDViewer) return;
  const lang = () => { try { return localStorage.getItem('gud_lang') || document.documentElement.lang || 'it'; } catch (e) { return document.documentElement.lang || 'it'; } };
  const tr = o => (o == null ? '' : typeof o === 'string' ? o : (o[lang()] || o.it || o.en || ''));
  const T = { close: { it: 'CHIUDI', en: 'CLOSE' }, open: { it: 'APRI ↗', en: 'OPEN ↗' }, prev: { it: 'Precedente', en: 'Previous' }, next: { it: 'Successivo', en: 'Next' }, web: { it: 'Se la pagina non si vede, aprila in una nuova scheda.', en: 'If the page does not show, open it in a new tab.' } };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let root = null, state = null;
  function ytId(u) { const m = String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : null; }
  function vimeoId(u) { const m = String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/); return m ? m[1] : null; }
  function resolve(src, base) { if (!src) return ''; if (/^(https?:|data:|\/)/i.test(src)) return src; return (base || '') + src; }
  function kindOf(m) {
    if (m.type) return m.type;
    const s = String(m.src || '');
    if (ytId(s) && /youtu/.test(s)) return 'youtube';
    if (vimeoId(s)) return 'vimeo';
    if (/\.(mp4|webm|mov)(\?|$)/i.test(s)) return 'video';
    if (/\.(jpe?g|png|gif|webp|svg)(\?|$)/i.test(s)) return 'image';
    return 'web';
  }
  function build() {
    root = document.createElement('div');
    root.className = 'gv';
    root.setAttribute('role', 'dialog'); root.setAttribute('aria-modal', 'true'); root.hidden = true;
    root.innerHTML = '<div class="gv-box"><div class="gv-head"><h2 class="gv-title"></h2><div class="gv-count"></div><button class="gv-x" type="button"></button></div>' +
      '<div class="gv-stage"></div><div class="gv-cap"></div>' +
      '<div class="gv-nav"><button class="gv-prev" type="button">◀</button><div class="gv-dots"></div><button class="gv-next" type="button">▶</button></div>' +
      '<div class="gv-desc"></div></div>';
    document.body.appendChild(root);
    root.addEventListener('click', e => { if (e.target === root) close(); });
    root.querySelector('.gv-x').addEventListener('click', close);
    root.querySelector('.gv-prev').addEventListener('click', () => go(-1));
    root.querySelector('.gv-next').addEventListener('click', () => go(1));
    document.addEventListener('keydown', e => {
      if (!state) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); go(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); go(1); }
    }, true);
    let sx = null;
    const st = root.querySelector('.gv-stage');
    st.addEventListener('pointerdown', e => { sx = e.clientX; });
    st.addEventListener('pointerup', e => { if (sx != null && Math.abs(e.clientX - sx) > 50) go(e.clientX < sx ? 1 : -1); sx = null; });
  }
  function render() {
    const { item, media, i, base } = state;
    root.querySelector('.gv-title').textContent = tr(item.t) || '';
    root.querySelector('.gv-x').textContent = '✕ ' + tr(T.close);
    root.querySelector('.gv-x').setAttribute('aria-label', tr(T.close));
    root.querySelector('.gv-count').textContent = media.length > 1 ? (i + 1) + '/' + media.length : '';
    const m = media[i] || {}, k = kindOf(m), src = resolve(m.src, base), stage = root.querySelector('.gv-stage');
    let h = '';
    if (k === 'image') h = '<img src="' + esc(src) + '" alt="' + esc(tr(m.caption) || tr(item.t)) + '">';
    else if (k === 'video') h = '<video src="' + esc(src) + '" controls playsinline preload="metadata"></video>';
    else if (k === 'youtube') { const id = ytId(m.src); h = '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(id) + '?rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="YouTube"></iframe>'; }
    else if (k === 'vimeo') { const id = vimeoId(m.src); h = '<iframe src="https://player.vimeo.com/video/' + esc(id) + '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Vimeo"></iframe>'; }
    else h = '<iframe src="' + esc(src) + '" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" referrerpolicy="no-referrer" title="web"></iframe><a class="gv-open" href="' + esc(src) + '" target="_blank" rel="noopener">' + esc(tr(T.open)) + '</a><p class="gv-hint">' + esc(tr(T.web)) + '</p>';
    stage.className = 'gv-stage gv-' + k;
    stage.innerHTML = h;
    root.querySelector('.gv-cap').textContent = tr(m.caption) || '';
    root.querySelector('.gv-desc').textContent = tr(item.d) || '';
    const dots = root.querySelector('.gv-dots');
    dots.innerHTML = media.length > 1 ? media.map((_, j) => '<button type="button" class="' + (j === i ? 'on' : '') + '" aria-label="' + (j + 1) + '"></button>').join('') : '';
    dots.querySelectorAll('button').forEach((b, j) => b.addEventListener('click', () => { state.i = j; render(); }));
    root.querySelector('.gv-prev').style.visibility = media.length > 1 ? 'visible' : 'hidden';
    root.querySelector('.gv-next').style.visibility = media.length > 1 ? 'visible' : 'hidden';
    root.querySelector('.gv-prev').setAttribute('aria-label', tr(T.prev));
    root.querySelector('.gv-next').setAttribute('aria-label', tr(T.next));
  }
  function go(d) { if (!state || state.media.length < 2) return; state.i = (state.i + d + state.media.length) % state.media.length; render(); }
  function open(item, opts) {
    opts = opts || {};
    if (!root) build();
    const media = (item.media || []).filter(m => m && m.src);
    if (!media.length) return Promise.resolve();
    return new Promise(res => {

    });
  }
  function close() {
    if (!state) return;
    const s = state; state = null;
    root.hidden = true; root.querySelector('.gv-stage').innerHTML = ''; document.documentElement.classList.remove('gv-on');
    try { if (s.prevFocus) s.prevFocus.focus({ preventScroll: true }); } catch (e) { /* */ }
    s.res();
  }
  window.GUDViewer = { open, close, isOpen: () => !!state, kindOf, ytId, vimeoId };
})();

  let idx = 0;
  return pushScreen({
    update() {
      if (pressed.has('up')) { idx = (idx - 1 + BAG.length) % BAG.length; J.blip(); this.msg = null; }
      if (pressed.has('down')) { idx = (idx + 1) % BAG.length; J.blip(); this.msg = null; }
      if (pressed.has('a') && BAG[idx].use) {
        if (S.coffee > 0 && S.hp < S.maxhp) { S.coffee--; S.hp = Math.min(S.maxhp, S.hp + 40); J.heal(); this.msg = lf('GUD beve un caffè. PS {h}/{m}', 'GUD drinks a coffee. HP {h}/{m}', { h: S.hp, m: S.maxhp }); }
        else { J.bump(); this.msg = S.coffee <= 0 ? lf('Caffè finiti!', 'Out of coffee!', {}) : lf('GUD è già in forma.', 'GUD is already fine.', {}); }
      }
      if (pressed.has('b') || pressed.has('start')) { J.blip(); this.resolve(); }
    },
    draw() {
      screenBg(lf('ZAINO', 'BAG', {}));
      BAG.forEach((it, i) => { const y = 28 + i * 14; if (i === idx) { ctx.fillStyle = C.Y; ctx.fillRect(4, y - 3, W - 8, 13); cursor(8, y, C.P); } dtext(ctx, it.n(), 18, y, 1, C.K); });
      box(4, H - 52, W - 8, 48);
      wrap(this.msg || tr(BAG[idx].d), cpl()).slice(0, 3).forEach((l, k) => dtext(ctx, l, 12, H - 42 + k * 12, 1, C.K));
    }
  });
}
async function startMenu() {
  await run(async () => {
    for (;;) {
      const c = await choose(TXT.menu, { cancel: true, x: W - 104, y: 4, w: 100 });
      if (c < 0 || c === 6) return;
      if (c === 0) await openDex();
      if (c === 1) await openCard();
      if (c === 2) await openBag();
      if (c === 3) { openQuickCV(); return; }
      if (c === 4) { const l = await choose(['ITALIANO', 'ENGLISH'], { cancel: true, idx: LANG === 'en' ? 1 : 0 }); if (l >= 0) { setLang(l === 1 ? 'en' : 'it'); tellParent({ lang: LANG }); } }
      if (c === 5) { save(); J.select(); await say(TXT.saved); }
    }
  });
}

/* ---------------- QUICK CV (accessible DOM panel) ---------------- */
let cvOpen = false;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function quickCVHTML() {
  const t = o => esc(tr(o));
  let h = `<header><h2>GUD</h2><p class="full">${esc(CV.full)}</p><p>${t(CV.role)}</p></header>`;
  SECTION_ORDER.forEach(id => {
    const s = CV.sections[id];
    h += `<section><h3>${t(s.title)}</h3><ul>${s.items.map(i => `<li><b>${esc(t(i.t))}</b> ${t(i.d)}</li>`).join('')}</ul></section>`;
  });
  h += `<section><h3>${LANG === 'en' ? 'Education' : 'Formazione'}</h3><ul>${CV.education.map(e => `<li>${t(e)}</li>`).join('')}</ul></section>`;
  h += `<section><h3>${LANG === 'en' ? 'Passions' : 'Passioni'}</h3><ul>${MONS.filter(m => !m.legendary).map(m => `<li><b>${esc(tr(m.type))}</b> ${t(m.d)}</li>`).join('')}</ul></section>`;
  h += `<section class="contacts"><h3>${LANG === 'en' ? 'Contacts' : 'Contatti'}</h3><p>${CONTACTS.map(k => `<a href="${esc(k.url)}" target="_blank" rel="noopener">${esc(k.show || k.label)}</a>`).join('')}</p></section>`;
  return h;
}
function openQuickCV() {
  const p = $('cvPanel'); $('cvBody').innerHTML = quickCVHTML(); p.hidden = false; cvOpen = true;
  $('cvTitle').textContent = LANG === 'en' ? 'QUICK CV' : 'CV RAPIDO';
  $('cvBody').scrollTop = 0;
  setTimeout(() => { try { $('cvClose').focus({ preventScroll: true }); } catch (e) { /* */ } }, 30);
}
function closeQuickCV() { $('cvPanel').hidden = true; cvOpen = false; try { cvs.focus({ preventScroll: true }); } catch (e) { /* */ } }
$('cvClose').addEventListener('click', closeQuickCV);
$('cvBtn').addEventListener('click', () => { AU.init(); cvOpen ? closeQuickCV() : openQuickCV(); });
function syncLang() {
  $('cvBtn').textContent = LANG === 'en' ? 'QUICK CV' : 'CV RAPIDO';
  $('langBtn').textContent = LANG === 'en' ? 'IT' : 'EN';
  $('langBtn').setAttribute('aria-label', LANG === 'en' ? 'Passa all\'italiano' : 'Switch to English');
  syncMute();
}
$('langBtn').addEventListener('click', () => { AU.init(); setLang(LANG === 'en' ? 'it' : 'en'); try { cvs.focus({ preventScroll: true }); } catch (e) { /* */ } });
HOOKS.lang.push(() => { syncLang(); if (S.scene !== 'boot' && SECTIONS.length) { buildMaps(); } if (cvOpen) $('cvBody').innerHTML = quickCVHTML(); });
HOOKS.mute.push(() => syncMute());
function modalOpen() { return cvOpen || !!(window.GUDViewer && GUDViewer.isOpen()); }
function closeModals() { if (cvOpen) closeQuickCV(); if (window.GUDViewer && GUDViewer.isOpen()) GUDViewer.close(); }
function syncMute() { const b = $('muteBtn'); b.textContent = AU.muted ? (LANG === 'en' ? 'SOUND OFF' : 'AUDIO OFF') : (LANG === 'en' ? 'SOUND ON' : 'AUDIO ON'); b.setAttribute('aria-pressed', AU.muted ? 'true' : 'false'); }
$('muteBtn').addEventListener('click', () => { AU.init(); AU.setMute(!AU.muted); syncMute(); tellParent({ mute: AU.muted }); });

/* ---------------- SCENES ---------------- */
function drawLang() {
  ctx.fillStyle = C.K; ctx.fillRect(0, 0, W, H);
  otext(ctx, 'GUDQUEST', W / 2, 30, W >= 320 ? 4 : 3, C.Y, C.P, 'center');
  dtext(ctx, 'SCEGLI LA LINGUA', W / 2, H / 2 - 34, 1, C.W, 'center');
  dtext(ctx, 'CHOOSE YOUR LANGUAGE', W / 2, H / 2 - 22, 1, C.B, 'center');
}
function drawTitle() {
  ctx.fillStyle = C.P; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.B; for (let y = 0; y < H; y += 8) ctx.fillRect(0, y + Math.floor(S.time * 8) % 8, W, 2);
  for (let i = 0; i < 20; i++) if ((Math.floor(S.time * 2) + i) % 4) { ctx.fillStyle = i % 2 ? C.Y : C.W; ctx.fillRect((i * 67 + 13) % W, (i * 41 + 7) % Math.round(H * 0.4), 2, 2); }
  const sc = W >= 380 ? 7 : W >= 320 ? 6 : 4, ty = MOBILE ? 34 : 22;
  otext(ctx, 'GUDQUEST', W / 2, ty, sc, C.Y, C.K, 'center', C.K);
  const by = ty + sc * 7 + 10;
  ctx.fillStyle = C.K; ctx.fillRect(0, by, W, 22);
  dtext(ctx, tr(TQ('subtitle')) || 'PINK ADVENTURE', W / 2, by + 4, tw(tr(TQ('subtitle')), 2) < W - 8 ? 2 : 1, C.W, 'center');
  dtext(ctx, tr(TQ('tagline')), W / 2, by + 30, 1, C.K, 'center');
  const gy = H - (MOBILE ? 118 : 104), f = Math.floor(S.time * 4) % 4;
  ctx.fillStyle = C.L; ctx.fillRect(0, gy + 64, W, H - gy - 64);
  ctx.drawImage(gud('run', f), Math.round(W * 0.3) - 34, gy - 4, 68, 68);
  const b = Math.abs(Math.sin(S.time * 3)) * 6;
  ctx.drawImage(SP.mons[0], Math.round(W * 0.68) - 22, gy + 20 - Math.round(b));
  if (S.titleWait && Math.floor(S.time * 2) % 2) otext(ctx, tr(TXT.pressStart), W / 2, H - 22, 1, C.P, C.W, 'center');
  dtext(ctx, '(C) 2026 GUD / ERGONAUTH', W / 2, H - 10, 1, C.B, 'center');
}
function drawIntro() {
  ctx.fillStyle = C.W; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.L; for (let y = 0; y < H - 50; y += 6) ctx.fillRect(0, y, W, 2);
  const cx = Math.round(W / 2), by = Math.round((H - 50) * 0.75);
  platform(cx, by, 50);
  ctx.drawImage(person(S.introWho || 'prof', 'down', 0), cx - 51, by - 96, 102, 102);
  if (S.introWho === 'gud') ctx.drawImage(SP.mons[1], cx + 40, by - 46);
  else ctx.drawImage(SP.mons[0], cx + 40, by - 46);
}
function drawHof() {
  ctx.fillStyle = C.P; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.B; for (let y = 0; y < H; y += 8) ctx.fillRect(0, y + Math.floor(S.time * 6) % 8, W, 2);
  for (let i = 0; i < 30; i++) if ((Math.floor(S.time * 3) + i) % 5) { ctx.fillStyle = i % 3 ? C.Y : C.W; ctx.fillRect((i * 53 + 7) % W, (i * 37 + 11) % (H - 50), 2, 2); }
  const sc = W >= 320 ? 3 : 2;
  otext(ctx, 'HALL OF FAME', W / 2, 8, sc, C.Y, C.K, 'center', C.K);
  const top = 8 + sc * 7 + 8, cx = Math.round(W / 2);
  const R = (a, b, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(a, b, w, h); };
  disc(R, cx, top + 34, 34, C.Y); disc(R, cx, top + 34, 30, C.W);
  ctx.drawImage(gud('victory', Math.floor(S.time * 4) % 2), cx - 34, top, 68, 68);
  const nb = SECTIONS.length; SECTIONS.forEach((s, i) => drawBadge(s.icon != null ? s.icon : i, Math.round(cx - nb * 10 + i * 20), top + 74, true));
  const team = S.caught.slice(0, 6), n = team.length, gap = Math.min(46, Math.floor((W - 16) / Math.max(1, n)));
  team.forEach((i, k) => ctx.drawImage(SP.mons[i], Math.round(W / 2 - (n * gap) / 2 + k * gap + (gap - 44) / 2), top + 94 + Math.round(Math.sin(S.time * 4 + k) * 2)));
}
async function hallOfFame() {
  S.hof = true; save();
  await fadeTo(1); S.scene = 'hof'; playSong('hof'); await fadeTo(0);
  await say([TQ('hof1'), CV.role, TQ('hof2')]);
  const c = await choose([L('CONTATTI', 'CONTACTS'), L('CONTINUA A ESPLORARE', 'KEEP EXPLORING')]);
  if (c === 0) await contactsMenu();
  await fadeTo(1); heal(); S.scene = 'world'; S.map = 'centro'; S.px = 5; S.py = 5; S.dir = 'up'; playSong('town'); await fadeTo(0); save();
}
async function enterWorld() {
  await fadeTo(1); S.scene = 'world'; playSong('town'); S.zone = null;
  const m = curMap(); S.loc = m.outdoor ? null : { text: m.title, t: 0 };
  await fadeTo(0); save();
}
async function newGame() {
  Object.assign(S, { lv: 30, hp: 120, maxhp: 120, pp: MOVES.map(m => m.pp), coffee: 3, badges: [], caught: [], seen: [], hof: false, introDone: false });
  await fadeTo(1); S.scene = 'intro'; S.introWho = 'prof'; playSong('town'); await fadeTo(0);
  const PI = LIST('questIntro');
  for (let i = 0; i < PI.length; i++) { if (i === 2) S.introWho = 'gud'; await say(i < 2 ? 'PROF. SERIF: ' + tr(PI[i]) : PI[i]); }
  await say(TQ(MOBILE ? 'hintMobile' : 'hint'));
  S.introDone = true; S.map = 'home'; S.px = 5; S.py = 5; S.dir = 'down';
  await enterWorld();
}
async function main() {
  await loadContent(); applyContent(); SP.mons = MONS.map(m => monSprite(m)); buildMaps();
  const sv = load();
  if (sv) Object.assign(S, sv);
  if (!MAPS[S.map]) { S.map = 'home'; S.px = 5; S.py = 5; }
  if (!store.get('gud_lang') && !EMBED) {
    S.scene = 'lang';
    const c = await choose(['ITALIANO', 'ENGLISH'], { x: Math.round(W / 2 - 52), y: Math.round(H / 2), w: 104 });
    setLang(c === 1 ? 'en' : 'it');
  }
  syncLang();
  for (;;) {
    S.scene = 'title'; playSong('title'); S.titleWait = true; await waitPress(); S.titleWait = false;
    const has = !!load();
    const opts = has ? [TXT.cont, TXT.newGame, TXT.quick] : [TXT.newGame, TXT.quick];
    const c = await choose(opts, { cancel: true, x: Math.round(W / 2 - 62), y: H - (MOBILE ? 92 : 78), w: 124 });
    if (c < 0) continue;
    const o = opts[c];
    if (o === TXT.quick) { openQuickCV(); continue; }
    if (o === TXT.cont) { Object.assign(S, load()); if (!MAPS[S.map]) { S.map = 'home'; S.px = 5; S.py = 5; } await enterWorld(); return; }
    await newGame(); return;
  }
}

/* ---------------- LOOP ---------------- */
function update(dt) {
  S.time += dt;
  for (let i = S.timers.length - 1; i >= 0; i--) { const t = S.timers[i]; t.t -= dt; if (t.t <= 0) { S.timers.splice(i, 1); t.res(); } }
  if (modalOpen() || S.paused) { pressed.clear(); return; }
  ensureSong();
  if (pressed.has('select')) openQuickCV();
  const hadUI = S.ui.length > 0;
  if (hadUI) updateUI(dt);
  if (S.scene === 'world') { if (hadUI) { const keep = new Set(pressed); pressed.clear(); worldUpdate(dt); keep.forEach(k => pressed.add(k)); } else worldUpdate(dt); }
  if (S.scene === 'battle') battleUpdate(dt);
  pressed.clear();
}
function render() {
  ctx.setTransform(KS, 0, 0, KS, 0, 0); ctx.imageSmoothingEnabled = false;
  if (S.scene === 'lang') drawLang(); else if (S.scene === 'title') drawTitle(); else if (S.scene === 'intro') drawIntro();
  else if (S.scene === 'world') drawWorld(); else if (S.scene === 'battle') drawBattle(); else if (S.scene === 'hof') drawHof();
  else { ctx.fillStyle = C.K; ctx.fillRect(0, 0, W, H); }
  drawUI();
  if (S.flash) { ctx.fillStyle = C.K; ctx.fillRect(0, 0, W, H); }
  if (S.fade > 0) { ctx.globalAlpha = S.fade; ctx.fillStyle = C.K; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (!last) last = t; let dt = (t - last) / 1000; last = t;
  if (dt <= 0) return; if (dt > 0.05) dt = 0.05;
  try { update(dt); render(); } catch (e) { console.error(e); }
}

/* ---------------- BOOT ---------------- */
buildSprites(); buildTiles(); buildFurniture();
SP.sign = signSprite(); SP.monument = monumentSprite(); SP.tower = towerSprite(); SP.mons = [];
resize();
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);
syncMute();
requestAnimationFrame(frame);
main();
window.GUDQ = { S, MAPS, get CV() { return CV; }, press, held, say, battle, hallOfFame, openQuickCV, setLang, heal, goTo, playFX, get MONS() { return MONS; } };

})();

</script>
